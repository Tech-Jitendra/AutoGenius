# Dev reverse proxy: mobile/emulator traffic → local services.
# Not required for Task 01; wired up before staging deployment.

upstream autogenius_api {
    server localhost:3001;
}

upstream autogenius_ai {
    server localhost:8000;
}

upstream autogenius_admin {
    server localhost:3002;
}

server {
    listen 80;
    server_name autogenius.local;

    location /api/ {
        proxy_pass http://autogenius_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ai/ {
        proxy_pass http://autogenius_ai;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://autogenius_admin;
        proxy_set_header Host $host;
    }
}
